name: Daily Stock Data Update

on:
  schedule:
    # Runs Monday through Friday at 18:00 UTC (after market close)
    - cron: '0 18 * * 1-5'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make update script executable
        run: chmod +x scripts/update-data.sh

      - name: Execute update script
        run: ./scripts/update-data.sh

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/predictions.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stock prediction data [skip ci]" && git push)
