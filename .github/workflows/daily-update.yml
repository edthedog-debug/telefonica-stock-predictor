name: Daily Stock Data Update

on:
  schedule:
    # Se ejecuta de lunes a viernes a las 18:00 UTC (tras el cierre de la Bolsa de Madrid)
    - cron: '0 18 * * 1-5'
  workflow_dispatch: # Permite ejecutar la acción manualmente desde GitHub

permissions:
  contents: write # Permite guardar y subir los datos actualizados al repositorio

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Fetch and update stock data
        run: |
          python scripts/update_data.py

      - name: Commit and push updated JSONs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update Telefónica stock data [skip ci]" && git push)
