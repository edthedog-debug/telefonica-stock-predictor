<div class="row mb-4">
    <div class="col-md-3">
        <div class="card text-center p-3 shadow-sm">
            <h6 class="text-muted">Value at Risk (VaR 95%)</h6>
            <h3 id="var-metric" class="fw-bold text-danger">-</h3>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center p-3 shadow-sm">
            <h6 class="text-muted">Max Drawdown</h6>
            <h3 id="drawdown-metric" class="fw-bold text-warning">-</h3>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center p-3 shadow-sm">
            <h6 class="text-muted">Sharpe Ratio</h6>
            <h3 id="sharpe-metric" class="fw-bold text-primary">-</h3>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center p-3 shadow-sm">
            <h6 class="text-muted">Composite Signal Score</h6>
            <h3 id="score-metric" class="fw-bold text-success">-</h3>
        </div>
    </div>
</div>
